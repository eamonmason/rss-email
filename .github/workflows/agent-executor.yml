name: Agent Executor

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  call-executor:
    if: ${{ !github.event.issue.pull_request && contains(github.event.comment.body, '@agent') && contains(github.event.comment.body, 'execute') }}
    uses: eamonmason/ai-workflows/.github/workflows/reusable-executor.yml@7bb010e327b2553843f9a4633ec3c1f78b51d136  # pre-hardening baseline
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
