version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  # promptfoo's own dependency island (see eval/README.md) - kept as a
  # separate entry/group so its bumps don't mix with the CDK tree's.
  - package-ecosystem: "npm"
    directory: "/eval"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      eval-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 10
