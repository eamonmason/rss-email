version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  # promptfoo's own dependency island (see eval/README.md) - kept as a
  # separate entry/group so its bumps don't mix with the CDK tree's.
  - package-ecosystem: "npm"
    directory: "/eval"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      eval-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 10
    ignore:
      # The agent workflows pin ai-workflows to a 40-char SHA on purpose: that
      # repo has no branch protection, so the pin is the control. Dependabot
      # would otherwise bump it weekly, and because dependency auto-merge is
      # enabled here, a bump to the agent engine could merge itself without
      # anyone reading the diff. Bump this deliberately, by hand.
      - dependency-name: "eamonmason/ai-workflows"
