<!DOCTYPE html>
<html lang="en">
  <head>
    <title>RSS Brief</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @media only screen and (max-width: 640px) {{
        .outer-td {{ padding: 10px !important; }}
        .inner-td {{ padding: 20px !important; }}
      }}
    </style>
  </head>
  <body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f5f5f5;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f5;">
      <tr>
        <td align="center" class="outer-td" style="padding: 20px;">
          <table cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 8px; max-width: 600px; width: 100%;">
            <tr>
              <td class="inner-td" style="padding: 30px;">
                <!-- Content -->
                {brief_content}

                <!-- Footer -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top: 40px; border-top: 1px solid #dee2e6;">
                  <tr>
                    <td align="center" style="padding-top: 20px;">
                      <p style="color: #666; font-size: 0.875em; margin: 0 0 8px 0;">A synthesised companion to your daily RSS digest.</p>
                      <p style="color: #666; font-size: 0.875em; margin: 0;"><strong>Articles synthesised:</strong> {article_count}</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
